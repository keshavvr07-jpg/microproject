<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration</title>
    <link rel="stylesheet" href="static/style.css">
</head>

<body>

    <header>
        <h1>Patient Registration</h1>
    </header>

    <main>
        <h2>Create Your Account</h2>

        <form action="http://127.0.0.1:5000/register" method="POST">

            <label>Full Name:</label><br>
            <input type="text" name="name" placeholder="Enter your name"><br><br>

            <label>Age:</label><br>
            <input type="number" name="age" placeholder="Enter your age"><br><br>

            <label>Gender:</label><br>
            <select name="gender">
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
            <br><br>

            <label>Email:</label><br>
            <input type="email" name="email" placeholder="Enter your email"><br><br>

            <label>Mobile Number:</label><br>
            <input type="tel" name="phone" placeholder="Enter mobile number"><br><br>

            <label>Address:</label><br>
            <textarea name="address" placeholder="Enter your address"></textarea><br><br>

            <button type="submit">Register</button>
        </form>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </main>

    <footer>
        <p>Cloud-Based Hospital Appointment System</p>
    </footer>

</body>
</html>
