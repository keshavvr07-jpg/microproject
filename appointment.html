<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment</title>
    <link rel="stylesheet" href="static/style.css">
</head>

<body>

<header>
    <h1>Book Hospital Appointment</h1>
</header>

<main>

    <h2>Appointment Form</h2>

    <form action="http://127.0.0.1:5000/book_appointment" method="POST">

        <label>Patient Name:</label><br>
        <input type="text" name="patient_name" placeholder="Enter patient name" required>
        <br><br>

        <label>Select Doctor:</label><br>
        <select name="doctor_name" required>
            <option value="">Select Doctor</option>
            <option>Dr. Rahul Sharma</option>
            <option>Dr. Priya Patil</option>
            <option>Dr. Amit Joshi</option>
        </select>
        <br><br>

        <label>Appointment Date:</label><br>
        <input type="date" name="appointment_date" required>
        <br><br>

        <label>Appointment Time:</label><br>
        <input type="time" name="appointment_time" required>
        <br><br>

        <label>Reason for Visit:</label><br>
        <textarea name="reason" placeholder="Enter reason for visit" required></textarea>
        <br><br>

        <button type="submit">Book Appointment</button>

    </form>

</main>

<footer>
    <p>Cloud-Based Hospital Appointment System</p>
</footer>

</body>
</html>
